name: Scrape Futbol Femenino Madrid CF B

on:
  schedule:
    - cron: '30 7,13,19 * * 1-5'   # L-V: 3 veces al dia (offset 30min)
    - cron: '*/10 8-12 * * 6'      # Sabado 10h-15h (hora espana): cada 10 min
    - cron: '30 0-7,13-20 * * 6'   # Sabado resto: cada hora
    - cron: '30 8-20 * * 0'        # Domingo: cada hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar scraper
        run: node FutbolFemenino/scrape-static.js

      - name: Commit datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FutbolFemenino/data/
          git diff --staged --quiet || git commit -m "data: actualizar datos fútbol femenino "
          git pull --rebase
          git push
