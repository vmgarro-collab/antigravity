name: Scrape Futbol Femenino Madrid CF B

on:
  schedule:
    - cron: '30 7,13,19 * * 1-5'  # lunes a viernes: 3 veces al día (offset 30min vs alevines)
    - cron: '30 8-20 * * 0,6'     # sábados y domingos: cada hora de 8h a 20h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar scraper
        run: node FutbolFemenino/scrape-static.js

      - name: Commit datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FutbolFemenino/data/
          git diff --staged --quiet || git commit -m "data: actualizar datos fútbol femenino [skip ci]"
          git pull --rebase
          git push
