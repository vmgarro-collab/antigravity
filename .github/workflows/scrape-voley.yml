name: Scrape Voley 2 de Mayo

on:
  schedule:
    - cron: '0 7,13,19 * * 1-5'    # L-V: 3 veces al dia
    - cron: '*/10 8-12 * * 6'      # Sabado 10h-15h (hora espana): cada 10 min
    - cron: '0 0-7,13-20 * * 6'    # Sabado resto: cada hora
    - cron: '0 8-20 * * 0'         # Domingo: cada hora
  workflow_dispatch:             # disparo manual desde GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: Voley
        run: npm install

      - name: Instalar navegador Playwright
        working-directory: Voley
        run: npx playwright install chromium --with-deps

      - name: Ejecutar scraper
        working-directory: Voley
        run: node scrape-static.js

      - name: Commit datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Voley/data/
          git diff --staged --quiet || git commit -m "data: actualizar datos voley 2 de Mayo [skip ci]"
          git pull --rebase
          git push
