name: Deploy OperacionBikini

on:
  push:
    branches: [main]
    paths: ['OperacionBikini/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OperacionBikini/package-lock.json
      - run: npm ci
        working-directory: OperacionBikini
      - run: npm run build
        working-directory: OperacionBikini
      - uses: actions/upload-pages-artifact@v3
        with:
          path: OperacionBikini/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
