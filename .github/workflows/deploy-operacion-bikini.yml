name: Deploy OperacionBikini

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OperacionBikini/package-lock.json

      - name: Build OperacionBikini
        working-directory: OperacionBikini
        run: |
          npm ci
          npm run build

      # Montar sitio completo: repo + build de OperacionBikini
      - name: Prepare full site
        run: |
          mkdir /tmp/site
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='OperacionBikini' . /tmp/site/
          mkdir -p /tmp/site/OperacionBikini
          cp -r OperacionBikini/dist/. /tmp/site/OperacionBikini/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
