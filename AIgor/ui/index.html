<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIgor</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>AIgor</h1>
    <p class="subtitle">Orquestador local de agentes de IA</p>

    <!-- IDLE -->
    <div id="view-idle" class="view active">
      <p style="color:var(--text-muted)">Listo para grabar. Pulsa el botón para comenzar.</p>
      <div class="row">
        <button class="btn btn-primary" id="btn-start">● Iniciar grabación</button>
      </div>
    </div>

    <!-- RECORDING -->
    <div id="view-recording" class="view">
      <div class="row" style="align-items:center">
        <span class="recording-dot"></span>
        <span class="badge">Grabando</span>
        <span class="timer" id="timer">00:00</span>
      </div>
      <canvas class="visualizer" id="visualizer"></canvas>
      <div class="transcript-box empty" id="live-transcript">Transcripción en tiempo real...</div>
      <div class="row">
        <button class="btn btn-danger" id="btn-stop">■ Detener</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div id="view-results" class="view">
      <p style="font-weight:600">Transcripción completa</p>
      <div class="transcript-box" id="full-transcript"></div>
      <div class="row">
        <button class="btn btn-primary" id="btn-summarize">✦ Generar minutas</button>
        <button class="btn btn-ghost" id="btn-new-1">Nueva grabación</button>
      </div>
    </div>

    <!-- SUMMARIZING -->
    <div id="view-summarizing" class="view" style="align-items:center;gap:16px">
      <div class="spinner"></div>
      <p style="color:var(--text-muted)">Generando minutas con Gemini...</p>
    </div>

    <!-- MINUTAS -->
    <div id="view-minutas" class="view">
      <p style="font-weight:600">Minutas de la reunión</p>
      <div class="result-box" id="minutas-content"></div>
      <div class="row">
        <button class="btn btn-primary" id="btn-copy">Copiar</button>
        <button class="btn btn-ghost" id="btn-new-2">Nueva grabación</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
