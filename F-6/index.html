<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Paraguas — Liga Veteranos</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="apple-touch-icon" href="icons/icon.jpg" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="1bd748c5-bbb3-4277-ab5f-0adfb1c53b38"></script>
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-content">
        <img src="icons/icon.jpg" alt="El Paraguas" class="header-logo">
        <div class="header-text">
          <h1>El Paraguas</h1>
          <p class="header-sub">Liga Veteranos Artificiales · F-6</p>
        </div>
        <span class="season-badge">RFFM</span>
        <button id="btn-refresh" class="btn-refresh" onclick="refreshData()" aria-label="Actualizar datos" title="Actualizar">
          <i data-lucide="refresh-cw" class="refresh-icon"></i>
        </button>
      </div>
    </header>

    <div id="loading" class="loading-msg"><span class="spinner"></span> Cargando...</div>
    <div id="error-msg" class="error-msg" style="display:none"></div>

    <div id="panels" class="panels" style="display:none">
      <section class="panel glass" id="panel-clasificacion">
        <h2><i data-lucide="list-ordered"></i> Clasificación</h2>
        <div class="table-scroll" id="clasificacion-body"></div>
        <p class="h2h-tip">Toca un equipo para ver sus partidos contra El Paraguas</p>
      </section>

      <section class="panel glass" id="panel-partidos">
        <h2><i data-lucide="calendar-days"></i> Partidos</h2>
        <div class="jornada-nav">
          <button id="jornada-prev" class="btn-nav">&#8592;</button>
          <span id="jornada-label"></span>
          <button id="jornada-next" class="btn-nav">&#8594;</button>
        </div>
        <div id="partidos-body"></div>
      </section>
    </div>

    <section class="panel glass goleadores-panel" id="panel-goleadores" style="display:none">
      <h2><i data-lucide="award"></i> Goleadores</h2>
      <div class="table-scroll" id="goleadores-body"></div>
    </section>

    <footer class="app-footer">
      <div class="app-version">v: paraguas-v1</div>
    </footer>
  </div>

  <!-- H2H modal -->
  <div id="h2h-modal" class="h2h-overlay" style="display:none">
    <div class="h2h-box">
      <div class="h2h-header">
        <span id="h2h-title"></span>
        <button onclick="closeH2H()" class="h2h-close"><i data-lucide="x"></i></button>
      </div>
      <div class="h2h-body">
        <table class="tabla-h2h">
          <thead><tr><th>Fecha</th><th>Local</th><th></th><th>Visitante</th></tr></thead>
          <tbody id="h2h-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const _hadCtrl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('/antigravity/F-6/sw.js', { scope: '/antigravity/F-6/' }).then(reg => { reg.update(); });
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (_hadCtrl) window.location.reload(); });
    }
  </script>
</body>
</html>
