<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liga Veteranos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="apple-touch-icon" href="icons/icon.jpg" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="1bd748c5-bbb3-4277-ab5f-0adfb1c53b38"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">
        <i data-lucide="trophy"></i>
        Liga Veteranos
      </h1>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="clasificacion">
        <i data-lucide="list-ordered"></i>
        Clasificación
      </button>
      <button class="tab-btn" data-tab="resultados">
        <i data-lucide="flag"></i>
        Resultados
      </button>
      <button class="tab-btn" data-tab="goleadores">
        <i data-lucide="star"></i>
        Goleadores
      </button>
      <button class="tab-btn" data-tab="calendario">
        <i data-lucide="calendar"></i>
        Calendario
      </button>
    </nav>

    <main class="tab-content">
      <div id="tab-clasificacion" class="tab-panel active">
        <div class="loading"><i data-lucide="loader-circle"></i> Cargando...</div>
      </div>
      <div id="tab-resultados" class="tab-panel">
        <div class="loading"><i data-lucide="loader-circle"></i> Cargando...</div>
      </div>
      <div id="tab-goleadores" class="tab-panel">
        <div class="loading"><i data-lucide="loader-circle"></i> Cargando...</div>
      </div>
      <div id="tab-calendario" class="tab-panel">
        <div class="loading"><i data-lucide="loader-circle"></i> Cargando...</div>
      </div><div id="jugador-results"></div>
      </div>
    </main>
  </div>

  <!-- H2H modal -->
  <div id="h2h-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center;padding:16px">
    <div class="h2h-box">
      <div class="h2h-header">
        <span id="h2h-title"></span>
        <button onclick="closeH2H()" class="h2h-close"><i data-lucide="x"></i></button>
      </div>
      <div class="h2h-body">
        <table class="h2h-table">
          <thead><tr><th>Fecha</th><th>Local</th><th></th><th>Visitante</th></tr></thead>
          <tbody id="h2h-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const _hadCtrl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('/antigravity/F-6/sw.js', { scope: '/antigravity/F-6/' }).then(reg => { reg.update(); });
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (_hadCtrl) window.location.reload(); });
    }
  </script>
  <footer class="app-footer">
    <div class="app-version">v: veteranos-v11</div>
  </footer>
</body>
</html>
